name: 工作台与 Skill
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: JianQianKan-Workbench/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Codex Skill and installer
        id: skill
        run: |
          python -B -m unittest discover -s .agents/skills/hair-consultation/tests
          python -B install-skill/install-skill.py --skills-dir .install-check/skills
          python -B install-skill/install-skill.py --skills-dir .install-check/skills
      - name: Verify workbench in an independent local directory
        if: ${{ success() || steps.skill.outcome == 'failure' }}
        id: workbench
        timeout-minutes: 5
        working-directory: JianQianKan-Workbench
        run: |
          npm ci --no-audit --no-fund
          npm run type-check
          npm run test:analysis
          npm run test:codex
          npm run test:colors
          npm run test:release
      - name: Verify the downloadable ZIP
        if: ${{ !cancelled() && steps.workbench.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: JianQianKan-Workbench
        run: node tools/verify-hair-workbench.mjs ../downloads/JianQianKan-Workbench-macOS-Windows-v1.2.0.zip --no-browser
